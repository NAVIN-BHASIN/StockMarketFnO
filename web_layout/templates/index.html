<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Layout Version - Trading Terminal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=3">
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
</head>
<body>
    <div class="top-bar">
        <div class="logo">PRO TERMINAL <span>WEB</span></div>
        <div class="controls" id="grid-controls">
            <label for="chart-count">Number of charts:</label>
            <select id="chart-count">
                <option value="1">1 (Full Screen)</option>
                <option value="2">2 (Side-by-Side)</option>
                <option value="4">4 (2x2)</option>
                <option value="6">6 (3x2)</option>
                <option value="8">8 (4x2)</option>
            </select>
        </div>
    </div>

    <div id="grid-container" class="grid-layout-1">
        <!-- Chart panes will be dynamically generated by JS -->
    </div>

    <!-- Comparison UI removed per request to move to desktop app -->

    <!-- Template for a chart pane -->
    <template id="pane-template">
        <div class="chart-pane">
            <div class="pane-header">
                <div class="pane-controls">
                    <select class="broker-select">
                        <option value="yfinance">NSE (yfinance)</option>
                        <option value="hyperliquid">Hyperliquid (Crypto)</option>
                    </select>
                    <input type="text" class="symbol-input" placeholder="Symbol (e.g. RELIANCE, TCS)" value="RELIANCE">
                    <select class="timeframe-select">
                        <option value="1m">1m</option>
                        <option value="5m">5m</option>
                        <option value="15m">15m</option>
                        <option value="1h">1h</option>
                        <option value="4h">4h</option>
                        <option value="1d" selected>1d</option>
                        <option value="1w">1w</option>
                    </select>
                    <button class="load-btn">Load</button>
                </div>
                <div class="ticker-bar">
                    <span class="ticker-symbol">RELIANCE</span>
                    <span class="ticker-price">0.00</span>
                </div>
            </div>
            <div class="chart-container"></div>
        </div>
    </template>

    <script src="{{ url_for('static', filename='app.js') }}?v=3"></script>
</body>
</html>
